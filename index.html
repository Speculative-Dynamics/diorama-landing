<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src 'self'; style-src 'sha256-jPm94zi0kkyDjhKYYHPFdfvT/vw6c+1HNq/lrthGcag='; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Diorama</title>
<style>
  :root { color-scheme: dark; }
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 24px;
    box-sizing: border-box;
    background: #09090B;
    color: #F4F4F6;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
    text-align: center;
  }
  main { max-width: 420px; }
  h1 { font-size: 22px; font-weight: 600; margin: 0 0 10px; }
  p { color: #A8A8B0; font-size: 15px; line-height: 1.5; margin: 0; }
  a { color: #D6D6DC; }
  .icon { width: 112px; height: 112px; border-radius: 25px; margin-bottom: 18px; box-shadow: 0 12px 40px rgba(255, 176, 97, 0.18); }
  small { display: block; margin-top: 18px; color: #6E6E76; font-size: 13px; }
</style>
</head>
<body>
<main>
  <img class="icon" src="icon.png" width="112" height="112" alt="">
  <h1>Diorama</h1>
  <p>A miniature of one room on an iPhone: tap the lights, the lamp, the speaker and the air conditioner right where they sit.</p>
  <small>A personal app. Not available on the App Store.</small>
</main>

</body>
</html>
